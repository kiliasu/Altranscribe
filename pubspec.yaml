name: altranscribe
description: "Altranscribe — real-time transcription and translation for Windows and Android."
publish_to: 'none'
version: 0.7.0+6

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.2.0
  desktop_drop: 0.8.4
  file_selector: 1.1.0
  ffi: 2.2.0
  crypto: 3.0.7
  qr: 4.0.0
  sherpa_onnx: 1.13.8

dev_dependencies:
  file_selector_platform_interface: 2.7.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/ggml-silero-v5.1.2.bin
    - assets/opencc/TSCharacters.txt
    - assets/opencc/TSPhrases.txt
    - assets/opencc/LICENSE
    # License texts that must ship with the bundled fonts, models and native code.
    - LICENSE
    - assets/fonts/MaterialSymbolsRounded-APACHE.txt
    - assets/fonts/MaterialSymbolsRounded-LICENSE.txt
    - assets/fonts/NotoSansSC-OFL.txt
    - assets/fonts/Roboto-LICENSE.txt
    - assets/fonts/RobotoFlex-LICENSE.txt
    - assets/fonts/RobotoFlex-OFL.txt
    - assets/models/Silero-LICENSE.txt
    - native/third_party/rnnoise/COPYING
    - native/third_party/speex/COPYING
  fonts:
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex.ttf
    - family: MaterialSymbolsRounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
